[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "wheel"]

[tool.black]
line-length = 79
target-version = ["py310"]
extend-exclude = '''
/(
    build
  | \.venv
)/
'''

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "test"
]

[tool.coverage.run]
source = [
  "fordoctest"
]
omit = [
  "fordoctest/__main__.py"
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[project]
name = "fordoctest"
dynamic = ["version"]
authors = [ {name = "Benelli, Federico Ezequiel", email = "federico.benelli@mi.unc.edu.ar"}]
license = "MPL-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
description = "Assure that your Fortran project is correctly documented."
keywords = ["Fortran", "Testing", "Documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Fortran :: 77",
    "Programming Language :: Fortran :: 95",
    "Programming Language :: Fortran :: 2003",
    "Programming Language :: Fortran :: 2008",
    "Programming Language :: Fortran :: 2018",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    'ford >= 7.0.5, < 8',
    'tomli >= 1.1; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "pytest-cov",
    "ipython",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/fedebenelli/fordoctester"
Repository = "https://github.com/fedebenelli/fordoctester"
Issues = "https://github.com/fedebenelli/fordoctester/issues"

[project.scripts]
fordoctest = "fordoctest.command_line:main"

[tool.setuptools.dynamic]
version = {attr = "fordoctest.__version__"}

[tool.setuptools.packages.find]
include = ["fordoctest*"]
